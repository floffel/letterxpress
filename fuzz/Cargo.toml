[package]
name = "letterxpress-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.letterxpress]
path = ".."
default-features = false

[[bin]]
name = "parse_envelope"
path = "fuzz_targets/parse_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_and_query"
path = "fuzz_targets/path_and_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "date_parse"
path = "fuzz_targets/date_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "money_parse"
path = "fuzz_targets/money_parse.rs"
test = false
doc = false
bench = false

[workspace]
